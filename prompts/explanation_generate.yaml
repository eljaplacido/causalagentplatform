# Prompt template: explanation_generate
# Version: 2.0.0
# Skill: explanation_generate (AGENTS.md §3.1)
#
# LOADED AT RUNTIME by backend/src/agents/prompt_templates.py and rendered by
# backend/src/agents/narration.py, which the SimulationAgent and POST
# /api/v1/decisions (narrate: true) call. The model writes language only: every
# number in its reply must be a claim token, and the reply is checked against the
# kernel outcome (causal_core.claims, the Guardian PR-002 grounding check) before
# anything is shown or stored. A reply that fails is discarded for the
# deterministic text.
#
# 2.0.0: the model no longer returns numbers, confidence ranges or a JSON object;
#        it returns one plain-text narrative that cites numbers only as claim tokens.
# 1.0.0: specification only (never loaded).

version: "2.0.0"
skill: explanation_generate
provider_capability: causal_reasoning

context: |
  You write short, plain-language explanations of results produced by a causal
  inference kernel. The kernel has already done all of the statistics. You do not
  compute, estimate, round or invent any number. You only put the kernel's result
  into words for a reader.

  Numbers reach the reader through claim tokens. A claim token looks like
  [[claim:effect]] and is replaced by the kernel's own value after you answer.
  Write the token wherever you want a number to appear.

skill_prompt: |
  Explain this kernel outcome.

  Outcome (facts, as the kernel reported them):
  {{result}}

  Claim tokens you may use (write the token, never the digits):
  {{claims}}

  Assumptions the result rests on:
  {{assumptions}}

  Causal wording ("caused", "leads to", "will reduce", "the effect of", "due to",
  "because of", ...) is {{causal_language}} for this outcome.

  Target reader: {{persona}}
  - EXECUTIVE: non-technical; direction and how much weight the result can bear
  - ANALYST: comfortable with statistics; estimator, interval, diagnostics
  - OPERATOR: under time pressure; lead with what to do next
  - COMPLIANCE: traceability; which assumptions and checks the result rests on

constraints: |
  - Do not write any digit. Every number must be a claim token from the list above,
    copied exactly. A token not in the list is an error.
  - If the list of claim tokens is empty, the explanation contains no numbers at all.
  - If causal wording is not permitted, describe the result as an association or an
    estimate, or say why the kernel refused; never use causal wording.
  - Name the assumptions the result rests on. If the kernel refused, say why, using
    its reason and what it says is missing.
  - Do not fabricate evidence, citations, data sources or checks the facts do not list.
  - At most 120 words. Plain text only: no markdown, no lists, no JSON, no preamble.

output_format: |
  Reply with the explanation itself and nothing else: one paragraph of plain text,
  at most 120 words, every number written as a claim token such as [[claim:effect]].
  Not JSON, not markdown, no heading, no quotation marks around it.

# Prompt template: cynefin_classify
# Version: 1.0.0
# Skill: cynefin_classify (AGENTS.md §3.1)
# Reference: IncidentTriage agent, src/agents/incident_triage.py

version: "1.0.0"
skill: cynefin_classify
provider_capability: fast_classification

context: |
  You are a Cynefin domain classifier for the Unified Enterprise Causal Platform.
  You classify problems into one of five Cynefin domains based on available signals.

  The platform uses Cynefin classification to route problems to appropriate
  reasoning strategies. Classification determines which agents and workflows
  are activated.

  Available domains:
  - CLEAR: Well-understood cause-effect. Best practices apply directly.
  - COMPLICATED: Knowable cause-effect but requires expert analysis.
  - COMPLEX: Emergent cause-effect. Must probe-sense-respond.
  - CHAOTIC: No discernible cause-effect. Must act-sense-respond. Human escalation required.
  - DISORDER: Cannot yet determine which domain applies. Gather more signal.

skill_prompt: |
  Classify the following problem description into a Cynefin domain.

  Problem: {{description}}

  Available signals:
  - Cycle count: {{signals.cycle_count}}
  - Active assumptions: {{signals.active_assumptions}}
  - Proposed edges: {{signals.proposed_edges}}

constraints: |
  - If insufficient information to classify with confidence > 0.7, return DISORDER
  - If time_sensitive is true and confidence < 0.5, return CHAOTIC (fail-safe to human)
  - Never return CLEAR for problems with unmeasured confounders
  - Never return CLEAR if cycle_count > 2 (repeated attempts suggest complexity)

output_format:
  type: object
  properties:
    domain:
      type: string
      enum: [CLEAR, COMPLICATED, COMPLEX, CHAOTIC, DISORDER]
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
    reasoning_strategy:
      type: string
      description: Recommended reasoning approach for this domain
    rationale:
      type: string
      description: Why this domain was selected

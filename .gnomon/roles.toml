model = "qwen3.6:35b"
endpoint = "local"
temperature = 0.1
top_p = 0.9
max_steps = 16
max_steps_total = 128
tools = ["read", "glob", "grep", "compute", "todo", "note", "bash"]
# Measured, 2026-09-02: this role holds `bash` and the scaffold gave it no

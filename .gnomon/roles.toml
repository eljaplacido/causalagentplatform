# Role routing — model, endpoint, and tool scope per role.
#
# These tags were detected at 'gnomon init' time on this machine.
# Found: gemma3-4b:latest (3.9B), nemotron-3-nano:4b (4B), qwen2.5:7b-instruct (7.6B), qwen2.5:14b-instruct (14.8B), nemotron-3-nano:30b-a3b-q4_K_M (31.6B), deepseek-r1:32b-qwen-distill-q4_K_M (32.8B), qwen3.6:35b (36B), nemotron-3-super:120b-a12b-q4_K_M (123.6B), qwen3.5:122b-a10b-q4_K_M (125.1B).
# Detection ran once, here; the tags below are now fixed data like any
# other part of the surface.
#
# These are concrete backend tags, not aliases: an alias would have to be
# resolved per machine, which is the machine-scoped config this harness
# forbids. Change any of them freely — `/models` lists what is available.
#
# `endpoint` names a block from [endpoints] in config.toml (default "local").
# `tools` narrows what the role may call. Omit it for every declared tool;
# an empty list means none.

# ── The specify → contract → test → implement → verify loop ────────────────
# Three roles, separated by what they are allowed to touch. The separation is
# enforced by the tool list, not by asking the model nicely.

[roles.coordinator]
model = "qwen3.6:35b"
endpoint = "local"
temperature = 0.2
top_p = 0.9
max_steps = 20
max_steps_total = 160
# Reads the repo and writes specs/contracts. Two things hold that to be true:
# no edit, so it cannot revise existing code in place, and write_allow, so the
# files it may create are the ones a planning turn produces. Without the second
# it could still write src/main.rs — withholding edit narrows how a role can
# change code, not whether it can.
#
# Widen this the moment it is wrong for your repo. A scope that refuses work
# you actually wanted is a scope you will delete in frustration; a scope that
# matches your layout is one you keep.
tools = ["read", "glob", "grep", "compute", "todo", "note", "task", "write", "skill", "mcp__causal"]
# Which roles this one may hand work to. A sub-turn runs with the TARGET
# role's tools, so this line -- not the one above -- bounds what delegation
# can cause. Omit it and any role is reachable. An empty list forbids it.
task_allow = ["implementor", "verifier"]
# Not .gnomon/**. The skill tool writes proposals to .gnomon/skills/proposed/
# through its own path, and accepting one is a human act that changes the
# surface hash. Letting a role reach .gnomon/skills/ with plain write would
# let it grant itself a standing instruction and skip that entirely.
#
# For this repository: specs and prose (docs/, specs/), contracts and the
# declared-not-implemented register (conformance/), and a benchmark's
# pre-registration -- written BEFORE results exist, which is the whole point of
# one (gnomon's benchmark-discipline, rule 6). Not the root *.md the scaffold
# allowed: README.md carries status claims, and changing those is a reviewed
# edit by the implementor alongside the evidence, not a planning side effect.
# `**/` matches zero directories too, so benchmarks/PRE-REGISTRATION.md is in.
write_allow = ["docs/**", "specs/**", "conformance/**", "benchmarks/**/PRE-REGISTRATION.md"]
description = "Intent and contracts: turns a request into a spec, a contract, or a declared_not_implemented entry"

[roles.implementor]
model = "qwen3.6:35b"
endpoint = "local"
temperature = 0.3
top_p = 0.95
max_steps = 32
max_steps_total = 256
tools = ["read", "glob", "grep", "compute", "todo", "note", "write", "edit", "bash", "mcp__causal"]
# Where this role may write: the source trees, the gate scripts and their
# baselines, and the docs and register it must keep true alongside the code.
# Not .github/** (CI workflow changes get a human), not the root compose and
# launcher files, not .gitignore. Widen it the moment it refuses real work.
#
# A ratchet baseline (scripts/*-baseline.json, scripts/coverage-floor.json) IS
# writable -- lowering one to lock a gain in is expected work. Raising one is
# caught by the scripts themselves, against the merge base, unless the commit
# says why with a `Ratchet-Exempt:` line. That is where that control lives; a
# path scope cannot express "may lower but not raise".
write_allow = [
  "backend/**", "frontend/**", "packages/**", "scripts/**", "conformance/**",
  "docs/**", "specs/**", "benchmarks/**", "prompts/**", "templates/**", "README.md",
]
# Operations whose damage is neither local nor undoable by re-running
# something. This role has unrestricted bash by necessity — it runs builds,
# installers and suites nobody can enumerate ahead of time — so the guardrail
# is a deny-list rather than an allow-list. Deny wins over allow.
#
# Not a substitute for branch protection on the remote: that is the control
# that binds everyone, and this one only binds the agent. It is the local half.
bash_deny = [
  # Measured against the real syntax: the previous list denied --force and -D
  # and let through 'git push origin +master' (force-push by refspec),
  # 'git push origin :master' (delete the remote branch), and
  # 'git branch --delete --force'. Four operations named, all four reachable
  # by their ordinary spellings.
  '\bgit\s+push\b[^|;&]*\s(--force|--force-with-lease|-f)\b',
  '\bgit\s+push\b[^|;&]*\s[+:]',
  '\bgit\s+push\b[^|;&]*[\s:+/](main|master|release)\b',
  '\bgit\s+push\b[^|;&]*--delete\b',
  '\bgit\s+branch\b[^|;&]*\s(-D\b|--delete\b|-d\b[^|;&]*--force\b)',
]

description = "Tests first (against a known ground truth for any causal number), then the code that satisfies them"

[roles.verifier]
model = "qwen3.6:35b"
endpoint = "local"
temperature = 0.1
top_p = 0.9
max_steps = 20
max_steps_total = 160
# No write, no edit. A verifier that can edit can make a failing suite pass
# by changing the suite, so the capability is simply absent.
#
# mcp__causal is here so the verifier can re-derive a causal number the
# implementor reported, from the tool, instead of trusting the transcript.
tools = ["read", "glob", "grep", "compute", "todo", "note", "bash", "mcp__causal"]
# 'bash' can write anything, so 'tools' alone cannot make this role
# read-only. This list is what actually constrains it: the gates can be run,
# nothing else. Remove it and the verifier can alter what it judges.
#
# For this repository, exactly the gate commands. gnomon checks EVERY segment of
# a compound command against this list (and refuses substitution and
# redirection outright), so `cd backend && .venv/bin/pytest -q` needs the `cd`
# segment admitted too -- pytest and mypy find their config from backend/, and
# npx resolves the frontend's tools from frontend/. `cd` alone changes nothing.
#
# What this does NOT make true, stated plainly: "the verifier cannot write".
# .gnomon/ci.sh and the test runners write caches and logs (.gnomon-out/ci/,
# backend/.coverage, .mypy_cache, .ruff_cache, frontend/tsconfig.tsbuildinfo),
# and pytest executes test code, which can write anything. The bound is "may run
# the gates and nothing else", not "has no effect on disk".
#
# KNOWN STARTUP WARNING, left standing on purpose. gnomon 0.2.3's surface audit
# warns that the first entry "admits a shell (runs anything)": it matches the
# pattern TEXT against /\b(sh|bash|...)\b/ (its message says NOT VERIFIED), and
# the `.sh` extension trips it. The entry is anchored to exactly two files this
# role cannot edit. The remedy the warning offers -- bash_deny '\b(sh|bash|...)\b'
# -- would also deny `.gnomon/ci.sh` itself, since deny wins over allow, so it
# is not applied; and rewriting the pattern to dodge the auditor's regex would
# be gaming a check, not satisfying it.
bash_allow = [
  '^\.gnomon/(ci|verify)\.sh$',
  '^(backend/)?\.venv/bin/(pytest|ruff|mypy)(\s|$)',
  '^npx (--no-install )?tsc --noEmit(\s|$)',
  '^npx (--no-install )?vitest run(\s|$)',
  '^npx (--no-install )?eslint(\s|$)',
  '^cd (backend|frontend)$',
]
bash_deny = [
  # The scaffold's list, kept: deny wins over allow, so these hold even if
  # someone widens bash_allow later.
  '-exec', '-execdir', '-ok', '-okdir', '-delete', '-fprint',
  '\bxargs\b',
  # A role that "cannot write" must not reach a language runtime.
  '\b(awk|gawk|perl|python3?|ruby|node)\b',
  # Flags that turn an allowed CHECK into a WRITE to source: ruff/eslint --fix,
  # ruff format, vitest snapshot update, --write of any kind.
  '--fix\b', '\bruff\s+format\b', '\bvitest\b[^|;&]*\s(-u|--update)\b', '--write\b',
]
description = "Runs .gnomon/ci.sh and reports what it measured. Cannot edit what it judges."

# ── General-purpose roles ──────────────────────────────────────────────────

[roles.plan]
model = "qwen3.6:35b"
endpoint = "local"
temperature = 0.2
top_p = 0.9
max_steps = 20
max_steps_total = 160
tools = ["read", "glob", "grep", "compute", "todo", "note", "task", "bash", "mcp__causal"]
task_allow = ["implement", "critique"]
# Measured, 2026-09-02: this role holds `bash` and the scaffold gave it no
# bash_deny, so the guard in tools.ts is skipped outright --
# `if (ctx.bashDeny && ctx.bashDeny.length > 0)`. Every spelling the
# implement role refuses reached the shell from here unrefused:
# 'git push --force', 'git push origin +master', 'git push origin :master',
# 'git push --delete origin master', 'git branch -D'. The starter skills tell
# the model not to do those; a skill is advice to a model, not a control, and a
# scaffolded surface must not read as though it is one.
#
# The same five patterns the implement role carries, copied verbatim so every
# bash-holding role refuses the same set.
bash_deny = [
  '\bgit\s+push\b[^|;&]*\s(--force|--force-with-lease|-f)\b',
  '\bgit\s+push\b[^|;&]*\s[+:]',
  '\bgit\s+push\b[^|;&]*[\s:+/](main|master|release)\b',
  '\bgit\s+push\b[^|;&]*--delete\b',
  '\bgit\s+branch\b[^|;&]*\s(-D\b|--delete\b|-d\b[^|;&]*--force\b)',
]

description = "Hardest reasoning, lowest call volume"

[roles.implement]
model = "qwen3.6:35b"
endpoint = "local"
temperature = 0.3
top_p = 0.95
max_steps = 28
# Stated explicitly. An omitted list means every declared tool, which handed

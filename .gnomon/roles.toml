description = "Must not share context with the implementer"

[roles.smol]
model = "qwen2.5:7b-instruct"
endpoint = "local"
temperature = 0.2
top_p = 0.95
max_steps = 6
tools = ["read", "glob", "grep", "compute", "todo"]
max_steps_total = 48
description = "Summarisation, compaction, commit messages"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "causal-platform-backend"
version = "0.1.0"
description = "Unified Enterprise Causal Platform — Python backend service"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "eljasuhonen" }]

dependencies = [
    # Web framework
    # Ceiling is deliberate: 0.141 changed how included routers are composed
    # (they stay behind a lazy wrapper instead of being flattened into app.routes).
    # The suite passes on it, so the range includes it; the next minor gets tested
    # before the ceiling moves.
    "fastapi>=0.115,<0.143",
    "uvicorn[standard]>=0.30.0",
    # SQLAlchemy async
    "sqlalchemy[asyncio]>=2.0.35",
    # Database drivers
    "asyncpg>=0.29.0",           # PostgreSQL / Cloud SQL
    "aiosqlite>=0.20.0",         # SQLite for local dev
    # Graph database
    "neo4j>=5.24.0",
    # Validation
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.14.2",  # CVE-2026-58203 fixed in 2.14.2
    # Auth. (python-jose was declared here and imported nowhere; it went, and with it
    # ecdsa, whose Minerva timing attack, CVE-2024-23342, has no fix upstream.)
    "firebase-admin>=6.5.0",
    # AI / agents
    "langgraph>=0.2.50",
    "langchain-anthropic>=1.4.6",  # PYSEC-2026-2556 fixed in 1.4.6
    "langchain-core>=1.3.3",       # PYSEC-2026-2564 fixed in 1.3.3
    "langchain-ollama>=0.2.0",    # Ollama local inference (preferred when OLLAMA_BASE_URL is set)
    "langchain-openai>=0.2.0",    # OpenAI / DeepSeek compatible API
    "pyyaml>=6.0",                # prompt templates (src/agents/prompt_templates.py)
    # Observability
    "structlog>=24.4.0",
    # HTTP client
    "httpx>=0.27.0",
    # Utilities
    "python-multipart>=0.0.31",    # PYSEC-2026-3036/3037/3040 fixed by 0.0.31
    "orjson>=3.10.0",
    # Numerical / data (used by skills, sensors, drift detection)
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scipy>=1.11.0",           # Statistical tests for drift detection
    "causal-core>=0.14.0",  # identification, estimation, refusals (packages/causal-core)
    "causal-decision>=0.5.0",  # act / approve / experiment / refuse (packages/causal-decision)
    # Security floors on TRANSITIVE dependencies. None of these is imported here; each
    # is a floor so that no resolution can pick a version with a published advisory
    # (pip-audit against the backend environment, 2026-09-25). The gate re-audits the
    # environment it tests on every run (.gnomon/ci.sh pip-audit-backend); raise a
    # floor here when that step names a new fix, rather than allowlisting it.
    "cryptography>=50.0.0",        # GHSA-537c-gmf6-5ccf, PYSEC-2026-3552/3553/3554 (google-auth, pyjwt)
    "pyjwt>=2.13.0",               # PYSEC-2026-175..179 (firebase-admin)
    "pyasn1>=0.6.4",               # PYSEC-2026-3455/3456/3457 (google-auth via rsa)
    "urllib3>=2.7.0",              # PYSEC-2026-141/142 (requests)
    "h2>=4.4.1",                   # PYSEC-2026-3628 (httpx[http2] via firebase-admin)
    "hpack>=4.2.0",                # CVE-2026-59980 (h2)
    "msgpack>=1.2.1",              # PYSEC-2026-3625 (CacheControl via firebase-admin)
    "langgraph-checkpoint>=4.1.1", # PYSEC-2026-2573 (langgraph)
    "langgraph-sdk>=0.3.15",       # PYSEC-2026-2194/2575 (langgraph)
    "langsmith>=0.8.18",           # CVE-2026-59152 (langchain-core)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "anyio[trio]>=4.6.0",
    "httpx>=0.27.0",           # async test client
    # Pinned: the ratchet baselines in scripts/lint-baseline.json are counts from a
    # specific version, and a different one is not comparable (CI ruff 0.16 found 12
    # findings against a 0.15 baseline of 0). Upgrade deliberately, re-measuring both.
    "ruff>=0.15,<0.16",
    "mypy>=1.20,<1.21",
    # Type stubs
    "sqlalchemy[mypy]>=2.0.35",
    # Security tooling, run by .gnomon/ci.sh (steps bandit, pip-audit-*). bandit is
    # pinned to a minor for the same reason as ruff: its ratchet counts per version.
    "pip-audit>=2.10,<3",
    "bandit[toml]>=1.9,<1.10",
]

production = [
    # Minimal extra deps for production image (subset of base)
    "uvicorn[standard]>=0.30.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "TCH", "ANN"]
ignore = [
    "ANN101",  # missing type annotation for `self`
    "ANN102",  # missing type annotation for `cls`
    "ANN401",  # Dynamically typed expressions (Any) are disallowed
    "B008",    # Do not perform function call in default argument (FastAPI Depends pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ── MyPy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = false
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = [
    "firebase_admin.*",
    "neo4j.*",
    "langgraph.*",
    "langchain_anthropic.*",
    "langchain_core.*",
    "structlog.*",
    "pandas.*",  # no stubs installed; the kernel packages type their own boundaries
    "yaml",      # no stubs installed; src/agents/prompt_templates.py checks what it loads
    "yaml.*",
]
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# No --cov-fail-under here. It applied to EVERY run, so the unit-only CI job
# (~75%) and any single-file run failed on coverage of code they never touched.
# Coverage is judged once, on the full suite, by scripts/coverage_gate.py against
# the committed ratchet in scripts/coverage-floor.json (run by .gnomon/ci.sh).
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--tb=short",
    "-v",
]
markers = [
    "performance: marks tests as performance benchmarks (deselect with '-m \"not performance\"')",
    "integration: marks tests requiring real service backends",
    "guardian: marks tests that validate Guardian bypass prevention",
    "llm_live: calls a real local LLM (Ollama at OLLAMA_BASE_URL); deselected unless LLM_LIVE=1",
]

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "src/db/migrations/*", "scripts/*"]

[tool.coverage.report]
# fail_under removed for the same reason as --cov-fail-under above: the floor is
# a ratchet in scripts/coverage-floor.json, enforced on the full suite only.
show_missing = true

# ── Bandit SAST ───────────────────────────────────────────────────────────────
[tool.bandit]
exclude_dirs = ["tests", "src/db/migrations"]
# No rule is skipped. B608 (SQL built from strings) was skipped for the whole tree
# until septa-50 reviewed its 13 sites: none carried a request value into SQL text,
# and all were rewritten as literal statements or SQLAlchemy Core, so B608 now
# enforces that none is added. B101 (assert) was skipped on the claim that ruff
# covers library code; ruff's S rules are not selected, and src had one assert,
# now an explicit check. B101 is LOW, so it is reported, not counted.
# .gnomon/ci.sh (step bandit-backend) passes --severity-level medium and blocks on any
# MEDIUM or HIGH finding above the ratchet in scripts/lint-baseline.json (0).

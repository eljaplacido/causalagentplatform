[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "causal-mcp"
dynamic = ["version"]
description = "MCP server exposing causal-core: identify, estimate, refute and verify causal claims from any agent."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Eljas Suhonen" }]
dependencies = [
    "causal-core>=0.7.0",
    "mcp>=2.2,<3",
]

[project.urls]
Homepage = "https://github.com/eljaplacido/causalagentplatform"
Source = "https://github.com/eljaplacido/causalagentplatform/tree/main/packages/causal-mcp"
Issues = "https://github.com/eljaplacido/causalagentplatform/issues"

[project.optional-dependencies]
http = ["uvicorn>=0.30"]
decision = ["causal-decision>=0.4.0"]
dev = ["pytest>=8", "ruff>=0.15,<0.16", "mypy>=1.20,<1.21"]  # pinned like the other packages: ratchets count per version

[project.scripts]
causal-mcp = "causal_mcp.server:main"

[tool.hatch.version]
# One source: the code reports the version it was built as, even from an editable
# install whose metadata was written before the last bump.
path = "src/causal_mcp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/causal_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--tb=short", "-q"]

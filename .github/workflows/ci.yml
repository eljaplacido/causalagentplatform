name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Fast lane: runs on every commit ─────────────────────────────────────────
jobs:

  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Python deps
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Install Node deps (semantic-types)
        working-directory: packages/semantic-types
        run: npm ci

      - name: Install Node deps (frontend)
        working-directory: frontend
        run: npm ci

      - name: Python lint (ruff)
        working-directory: backend
        run: ruff check src/ tests/

      - name: Python type check (mypy)
        working-directory: backend
        run: mypy src/ --strict

      - name: TypeScript type check (semantic-types)
        working-directory: packages/semantic-types
        run: npx tsc --noEmit

      - name: TypeScript type check (frontend)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend lint (ESLint)
        working-directory: frontend
        run: npx eslint src/ --max-warnings 0

  # ── Unit tests ────────────────────────────────────────────────────────────

  unit-tests-python:
    name: Unit Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run unit tests
        working-directory: backend
        run: pytest tests/unit/ -x --tb=short --cov=src --cov-report=xml -q

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: python-unit

  unit-tests-frontend:
    name: Unit Tests (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Run vitest
        working-directory: frontend
        run: npx vitest run --reporter=verbose --coverage

  # ── Security scan ─────────────────────────────────────────────────────────

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Python dependency audit (pip-audit)
        working-directory: backend
        run: pip-audit

      - name: Python SAST (bandit)
        working-directory: backend
        run: bandit -r src/ -ll

      - name: npm audit (semantic-types)
        working-directory: packages/semantic-types
        run: npm audit --audit-level=high

      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high

# ── Integration lane: runs on PRs ───────────────────────────────────────────

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: causal
          POSTGRES_PASSWORD: causal_test
          POSTGRES_DB: causalplatform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/causal_test
        ports:
          - "7474:7474"
          - "7687:7687"
        options: >-
          --health-cmd "cypher-shell -u neo4j -p causal_test 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 15

      kafka:
        image: confluentinc/cp-kafka:7.6.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          CLUSTER_ID: causal-ci-cluster
        ports: ["9092:9092"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://causal:causal_test@localhost:5432/causalplatform_test
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: causal_test
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          ENVIRONMENT: test
        run: pytest tests/integration/ --timeout=120 -v

  guardian-integrity-tests:
    name: Guardian Integrity Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: causal
          POSTGRES_PASSWORD: causal_test
          POSTGRES_DB: causalplatform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run Guardian tests (must be 100% pass)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://causal:causal_test@localhost:5432/causalplatform_test
          ENVIRONMENT: test
        run: pytest tests/guardian/ -v --tb=long

  causal-correctness-tests:
    name: Causal Correctness Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run causal correctness tests
        working-directory: backend
        run: pytest tests/causal_correctness/ -v

# ── Container lane: runs on PRs to main ─────────────────────────────────────

  container-build:
    name: Container Build & Scan
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: causalplatform-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: causalplatform-backend:ci
          exit-code: 1
          severity: HIGH,CRITICAL
          format: table

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: causalplatform-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: causalplatform-frontend:ci
          exit-code: 1
          severity: HIGH,CRITICAL
          format: table

# ── E2E tests: runs on merge to main ─────────────────────────────────────────

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start full stack
        run: docker compose up -d --wait

      - name: Run Playwright tests
        working-directory: frontend
        env:
          BASE_URL: http://localhost:3000
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/

# ── Quality gate summary ─────────────────────────────────────────────────────

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs:
      - lint-and-type-check
      - unit-tests-python
      - unit-tests-frontend
      - security-scan
    steps:
      - run: echo "All fast-lane quality gates passed."

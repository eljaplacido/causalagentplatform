name: CI

# One gate, the same one developers run locally: .gnomon/ci.sh. CI only builds the
# environments ci.sh looks for, runs it, and refuses to count a skipped step as a pass.
#
# This replaces a ten-job pipeline in which no job could pass (Sep 2026 audit): the
# jobs needed Kafka/Neo4j services nothing used, a global coverage threshold that
# failed partial runs, and lint/type checks against a baseline nobody had measured.

on:
  # push runs on main only: a PR already runs on pull_request, and a second run of the
  # same commit per branch push doubled the load on a self-hosted runner.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, on main: an advisory published since the last push surfaces here (the
  # pip-audit and npm-audit steps) without waiting for a PR to touch a dependency.
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Where jobs run: the repository variable CI_RUNS_ON, a JSON runner label or list
# (e.g. '["self-hosted","linux","ARM64","causalplatform-ci"]'). Unset, jobs run on
# GitHub's ubuntu-latest. A self-hosted runner is how CI runs while hosted minutes are
# unavailable; delete the variable to return to hosted runners. Nothing host-specific
# is written here -- the label names the role, not the machine.
jobs:
  gate:
    name: .gnomon/ci.sh
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 75
    env:
      # Real-data benchmarks (T2 IHDP, T3 LaLonde): fetched by pinned SHA-256, never
      # committed (no redistribution licence), cached between runs.
      CAUSAL_FETCH: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    # PostgreSQL for the gate's backend-pytest-postgres step: the backend suite run
    # on the schema backend/src/db/migrations/*.sql builds, not on SQLite. The test
    # fixtures create (and drop) a fresh database on it per run. The password is a
    # CI-only throwaway for a container that lives as long as this job and listens
    # only on the runner; it guards nothing. The app's queries in that run connect
    # as causal_app, which row-level security binds, through a login role the
    # fixtures create for the run with a random password and drop at the end
    # (backend/tests/conftest.py), so POSTGRES_USER must be able to create
    # databases and roles -- the image's superuser can -- and nothing else here
    # needs a password for it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: postgres
        ports:
          # Loopback only, on a port Docker picks: on a self-hosted runner a bare
          # 5432:5432 publishes the throwaway database on every interface of the host,
          # and several runners on one host would collide on a fixed port. The step
          # below reads the chosen port from job.services.
          - 127.0.0.1::5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the register cites some claims at the revision they were made
          # (file@rev:line), and a shallow clone cannot verify those.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Cache benchmark data
        uses: actions/cache@v4
        with:
          path: ~/.cache/causal-core
          key: causal-core-data-${{ hashFiles('benchmarks/t2-ihdp/PRE-REGISTRATION.md', 'benchmarks/t3-lalonde/PRE-REGISTRATION.md') }}

      # Both environments install from a hash-pinned lock (requirements/*.txt, made by
      # `python3 scripts/py_lock.py relock`), in two steps. The first is the only one that
      # fetches: every distribution pinned, every file checked against its sha256, and
      # --no-deps so nothing outside the lock is resolved (pip itself is in the lock and
      # upgrades itself here). The second installs this checkout's own packages, which
      # are not on an index and so not in the lock: --no-deps again, so they pull in
      # nothing, and --no-build-isolation, so they build with the hatchling the lock just
      # installed instead of fetching an unhashed one. `pip check` proves the pair whole;
      # the gate's python-lock step then requires the environment to equal the lock.
      - name: Backend environment (backend/.venv)
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -q --require-hashes --no-deps \
            -r requirements/backend.txt
          backend/.venv/bin/python -m pip install -q --no-deps --no-build-isolation \
            -e packages/causal-core -e packages/causal-decision -e "backend[dev]"
          backend/.venv/bin/python -m pip check

      - name: Kernel environment (packages/causal-core/.venv)
        run: |
          python -m venv packages/causal-core/.venv
          packages/causal-core/.venv/bin/python -m pip install -q --require-hashes --no-deps \
            -r requirements/kernel.txt
          packages/causal-core/.venv/bin/python -m pip install -q --no-deps --no-build-isolation \
            -e "packages/causal-core[dev,crosscheck,ml]" \
            -e "packages/causal-decision[dev]" \
            -e "packages/causal-mcp[dev,http,decision]"
          packages/causal-core/.venv/bin/python -m pip check

      - name: Frontend dependencies
        run: npm ci

      - name: Licence gate (runtime dependencies must be permissive)
        run: |
          packages/causal-core/.venv/bin/python packages/causal-core/scripts/check_licenses.py causal-core
          packages/causal-core/.venv/bin/python packages/causal-core/scripts/check_licenses.py causal-mcp
          packages/causal-core/.venv/bin/python packages/causal-core/scripts/check_licenses.py causal-decision

      - name: Run the gate
        env:
          # The service container above (CI-only credentials). Unset, the
          # backend-pytest-postgres step is SKIPPED and the gate exits 2.
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci-only-throwaway@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        # ci.sh's exit contract: 0 passed, 1 a blocking step failed, 2 could not measure
        # (a step's toolchain is absent -- in CI that means the environment above is
        # broken -- or an advisory database could not be reached, so pip-audit or npm
        # audit did not happen; an unaudited build is not a passing one), 3 an advisory regressed (documents drifted from the code). 1 and 2 fail
        # the build; 3 is annotated, so drift is visible on the PR without blocking a merge
        # -- the SeptaCore loop (`septacore check`) is where it gets worked down.
        run: |
          set +e
          bash .gnomon/ci.sh 2>&1 | tee ci-gate.log
          rc="${PIPESTATUS[0]}"
          case "$rc" in
            0) ;;
            3) echo "::warning::documents drifted from the code they describe (see doc-reconciliation in the summary)" ;;
            2) echo "::error::the gate could not measure a step -- a toolchain is missing, or an advisory database was unreachable (see SKIPPED in the summary)"; exit 2 ;;
            *) exit "$rc" ;;
          esac

      - name: Keep the gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-gate-log
          path: ci-gate.log

  # The container images, in their own job so the gate job above stays one command.
  # Each image is built from its Dockerfile (from the repository root, as both
  # Dockerfiles require) and scanned by Trivy at a pinned version, by digest: Trivy's
  # own release channel was compromised once (March 2026), so neither a moving tag nor
  # a setup action is trusted here. scripts/image_scan.py judges the report: a HIGH or
  # CRITICAL finding with a published fix fails the job unless
  # scripts/image-scan-allowlist.json excuses it with a reason and a review_by date; a
  # finding with no fix published is listed, not failed. The job also keeps a
  # CycloneDX SBOM of each image as an artifact. On the weekly schedule too, so a fix
  # published since the last push surfaces without one.
  images:
    name: image ${{ matrix.image }} (build + Trivy)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    env:
      TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build ${{ matrix.image }}/Dockerfile
        run: docker build -f "${{ matrix.image }}/Dockerfile" -t "causal-platform-${{ matrix.image }}:ci-${{ github.run_id }}-${{ github.run_attempt }}" .

      - name: Cache the vulnerability database
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Scan (Trivy, HIGH and CRITICAL)
        run: |
          mkdir -p "$HOME/.cache/trivy" scan
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" -v "$PWD/scan:/out" "$TRIVY_IMAGE" \
            image --scanners vuln --severity HIGH,CRITICAL --list-all-pkgs --format json \
            --output "/out/trivy-${{ matrix.image }}.json" "causal-platform-${{ matrix.image }}:ci-${{ github.run_id }}-${{ github.run_attempt }}"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" -v "$PWD/scan:/out" "$TRIVY_IMAGE" \
            image --skip-db-update --format cyclonedx \
            --output "/out/sbom-${{ matrix.image }}.cdx.json" "causal-platform-${{ matrix.image }}:ci-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Judge the report against the reviewed allowlist
        run: python3 scripts/image_scan.py "scan/trivy-${{ matrix.image }}.json" --image "${{ matrix.image }}"

      - name: Keep the report and the image SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.image }}
          path: scan/

      - name: Remove this run's image
        # Tags are per run (parallel runners must not scan each other's builds), so
        # without this a self-hosted runner accumulates one image per run.
        if: always()
        run: docker image rm -f "causal-platform-${{ matrix.image }}:ci-${{ github.run_id }}-${{ github.run_attempt }}" || true

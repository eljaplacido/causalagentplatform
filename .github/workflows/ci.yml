name: CI

# One gate, the same one developers run locally: .gnomon/ci.sh. CI only builds the
# environments ci.sh looks for, runs it, and refuses to count a skipped step as a pass.
#
# This replaces a ten-job pipeline in which no job could pass (Sep 2026 audit): the
# jobs needed Kafka/Neo4j services nothing used, a global coverage threshold that
# failed partial runs, and lint/type checks against a baseline nobody had measured.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # Weekly, on main: an advisory published since the last push surfaces here (the
  # pip-audit and npm-audit steps) without waiting for a PR to touch a dependency.
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: .gnomon/ci.sh
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Real-data benchmarks (T2 IHDP, T3 LaLonde): fetched by pinned SHA-256, never
      # committed (no redistribution licence), cached between runs.
      CAUSAL_FETCH: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the register cites some claims at the revision they were made
          # (file@rev:line), and a shallow clone cannot verify those.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Cache benchmark data
        uses: actions/cache@v4
        with:
          path: ~/.cache/causal-core
          key: causal-core-data-${{ hashFiles('benchmarks/t2-ihdp/PRE-REGISTRATION.md', 'benchmarks/t3-lalonde/PRE-REGISTRATION.md') }}

      - name: Backend environment (backend/.venv)
        run: |
          python -m venv backend/.venv
          # pip first: the gate's pip-audit audits this environment, pip included.
          backend/.venv/bin/python -m pip install -q --upgrade pip
          backend/.venv/bin/pip install -q -e packages/causal-core \
            -e packages/causal-decision -e "backend[dev]"

      - name: Kernel environment (packages/causal-core/.venv)
        run: |
          python -m venv packages/causal-core/.venv
          packages/causal-core/.venv/bin/python -m pip install -q --upgrade pip
          packages/causal-core/.venv/bin/pip install -q \
            -e "packages/causal-core[dev,crosscheck,ml]" \
            -e "packages/causal-decision[dev]" \
            -e "packages/causal-mcp[dev,http,decision]" httpx

      - name: Frontend dependencies
        run: npm ci

      - name: Licence gate (runtime dependencies must be permissive)
        run: |
          packages/causal-core/.venv/bin/python packages/causal-core/scripts/check_licenses.py causal-core
          packages/causal-core/.venv/bin/python packages/causal-core/scripts/check_licenses.py causal-mcp
          packages/causal-core/.venv/bin/python packages/causal-core/scripts/check_licenses.py causal-decision

      - name: Run the gate
        # ci.sh's exit contract: 0 passed, 1 a blocking step failed, 2 could not measure
        # (a step's toolchain is absent -- in CI that means the environment above is
        # broken -- or an advisory database could not be reached, so pip-audit or npm
        # audit did not happen; an unaudited build is not a passing one), 3 an advisory regressed (documents drifted from the code). 1 and 2 fail
        # the build; 3 is annotated, so drift is visible on the PR without blocking a merge
        # -- the SeptaCore loop (`septacore check`) is where it gets worked down.
        run: |
          set +e
          bash .gnomon/ci.sh 2>&1 | tee ci-gate.log
          rc="${PIPESTATUS[0]}"
          case "$rc" in
            0) ;;
            3) echo "::warning::documents drifted from the code they describe (see doc-reconciliation in the summary)" ;;
            2) echo "::error::the gate could not measure a step -- a toolchain is missing, or an advisory database was unreachable (see SKIPPED in the summary)"; exit 2 ;;
            *) exit "$rc" ;;
          esac

      - name: Keep the gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-gate-log
          path: ci-gate.log
